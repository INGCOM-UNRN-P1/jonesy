# .jonesy.toml — configuración de un proyecto para jonesy.
# Todas las secciones son opcionales: sin este archivo jonesy usa el Makefile
# (make, make run, make test) o gcc -std=c11 -Wall -Wextra -g -O0 sobre el .c activo.

[compilar]
# F6. Vacío = "make" si hay Makefile, si no gcc sobre el archivo activo.
comando = "make"

[ejecutar]
# Ctrl+F5 (corre en el deck). Vacío = "make run" si existe, si no compilar && ./programa.
comando = "make run"

[depurar]
# F5. Comando que compila con símbolos (vacío = el de [compilar]).
compilar = "make"
# Ejecutable a depurar (vacío = el nombre del .c activo sin extensión).
programa = "tp"
argumentos = ["datos/entrada.txt"]

[examen]
# Enunciado de solo lectura (vacío = consigna.md, enunciado.md o CONSIGNA.md).
consigna = "consigna.md"
# Duración en minutos para el cronómetro (0 = sin cronómetro).
duracion_min = 120
# Verificación de la entrega (vacío = "make test" si el Makefile lo define, si no el
# «verificar» del entorno de la cátedra).
verificar = "make test"
# Archivos de la entrega (vacío = *.c, *.h, *.md y el Makefile, también en src/, test/, include/).
archivos = ["*.c", "*.h", "Makefile"]
# SHA-256 de los plugins Python que la cátedra autoriza durante el examen.
plugins_permitidos = []

[interfaz]
# Posición del quick-doc: "derecha" o "inferior".
quickdoc = "derecha"
# Copiar al portapapeles del sistema con OSC 52 (también por SSH).
osc52 = true
# Forzar caracteres ASCII en lugar de los de caja.
ascii = false
# Colores: "oscuro" (por defecto), "claro" (terminales de fondo blanco) o "contraste"
# (sólo los 16 colores ANSI). También desde Archivo → Configuración del entorno → Apariencia, que queda en la sesión.
tema = "oscuro"
# Shell del deck (vacío = $SHELL).
shell = ""
# Entorno de la cátedra (INGCOM-UNRN-P1/entorno): vacío = buscarlo en P1_ENTORNO o
# ~/p1/entorno y sumar sus comandos al PATH del deck, la compilación y las herramientas
# (y su gdbinit al depurador); "no" = no usarlo; o la ruta de la instalación.
entorno = ""

[interfaz.paneles]
# Tamaños iniciales; se cambian arrastrando los bordes con el mouse o desde
# Configuración del entorno → Apariencia → Tamaños de paneles, y lo ajustado se recuerda en .jonesy/session.json.
izquierdo = 32   # barra de archivos/proyecto, en columnas
consigna = 0     # % del ancho (0 = 25 % en modo espacioso, 35 % en estándar)
quickdoc = 25    # % del ancho con el quick-doc a la derecha
dock = 4         # filas del quick-doc en el dock inferior
lateral = 30     # % del panel derecho (git, reglas, variables)
inferior = 10    # filas del panel inferior (problemas, terminal, depurador)

[formato]
# Editar → Autoformato (Alt+Shift+F). {archivo} es la ruta del archivo a formatear
# en el lugar. Vacío = "gaff format {archivo}" si gaff está instalado, si no
# "clang-format -i {archivo}".
comando = ""

[documentacion]
# Directorio donde «make doc» (corbel proyecto) deja api.json. doc/ no se versiona:
# jonesy lo busca, lo usa en el quick-doc y avisa en la barra cuando falta o quedó
# viejo respecto del código, con un botón que corre make doc.
dir = "doc"
# Aviso en la barra cuando falta o quedó vieja: true siempre, false nunca; sin
# indicarlo, sólo si el proyecto la usa (objetivo doc, corbel.toml o doc/).
# aviso = true

[integraciones]
# Herramientas del ecosistema como plugins (ver docs/integraciones.md). Las de fábrica
# (ripley, gaff, kaneda, spunkmeyer al guardar; corbel, daedalus, tetsuo, motoko y
# callahan desde Herramientas) se activan solas si están instaladas.
desactivar = []          # p. ej. ["spunkmeyer"]
activar = []             # para encender una que un manifiesto propio trae apagada
# Integraciones propias del proyecto: .jonesy/integraciones/*.toml

[ripley]
# Correr "ripley check <archivo> --format json" al guardar archivos C.
activo = true
comando = "ripley"
