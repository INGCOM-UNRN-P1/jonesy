[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Martín René Vilugrón <martinvilu@gmail.com>"]
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
portable-pty = "0.8"
vt100 = "0.15"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
base64 = "0.22"
libc = "0.2"
tempfile = "3"
signal-hook = "0.3"
tar = { version = "0.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
