# ------------------------------------------------------------------ stdlib.h: memoria

[[funcion]]
nombre = "malloc"
cabecera = "stdlib.h"
firma = "void *malloc(size_t size)"
descripcion = "Reserva size bytes de memoria dinámica sin inicializar."
retorno = "Puntero al bloque reservado. NULL si no hay memoria disponible."
parametros = [{ tipo = "size_t", nombre = "size", desc = "Cantidad de bytes: calculala con sizeof, por ejemplo n * sizeof *p." }]
trampas = [
  "Verificá si devolvió NULL antes de usar el puntero.",
  "La memoria no está inicializada: si necesitás ceros, usá calloc.",
  "Para un string de n caracteres reservá n + 1 bytes: el '\\0' final también ocupa lugar.",
  "Todo malloc necesita exactamente un free.",
]
reglas = ["0x3001h", "0x300Bh"]

[[funcion]]
nombre = "calloc"
cabecera = "stdlib.h"
firma = "void *calloc(size_t nmemb, size_t size)"
descripcion = "Reserva memoria para nmemb elementos de size bytes y la inicializa en cero."
retorno = "Puntero al bloque (todo en cero). NULL si no hay memoria."
parametros = [
  { tipo = "size_t", nombre = "nmemb", desc = "Cantidad de elementos." },
  { tipo = "size_t", nombre = "size", desc = "Tamaño de cada elemento: sizeof *p." },
]
trampas = ["Verificá si devolvió NULL.", "Ceros en bytes no garantiza punteros NULL ni 0.0 en todas las plataformas (sí en las del curso)."]
reglas = ["0x3001h", "0x300Bh"]

[[funcion]]
nombre = "realloc"
cabecera = "stdlib.h"
firma = "void *realloc(void *ptr, size_t size)"
descripcion = "Cambia el tamaño de un bloque dinámico, moviéndolo si hace falta."
retorno = "Puntero al bloque (puede ser otra dirección). NULL si falla, y el bloque original sigue siendo válido."
parametros = [
  { tipo = "void *", nombre = "ptr", desc = "Bloque devuelto por malloc/calloc/realloc, o NULL (equivale a malloc)." },
  { tipo = "size_t", nombre = "size", desc = "Nuevo tamaño total en bytes." },
]
trampas = [
  "No hagas p = realloc(p, n): si falla, perdés el bloque original (fuga). Usá un puntero auxiliar.",
  "Los punteros al bloque viejo quedan inválidos si realloc lo movió.",
]
reglas = ["0x3001h", "0x300Bh"]

[[funcion]]
nombre = "free"
cabecera = "stdlib.h"
firma = "void free(void *ptr)"
descripcion = "Libera un bloque de memoria dinámica."
retorno = "No devuelve nada."
parametros = [{ tipo = "void *", nombre = "ptr", desc = "Bloque devuelto por malloc/calloc/realloc, o NULL (no hace nada)." }]
trampas = [
  "Después de free, asigná NULL al puntero para no usarlo colgado.",
  "Liberar dos veces el mismo bloque es comportamiento indefinido.",
  "En estructuras enlazadas, liberá los nodos internos antes que el contenedor.",
  "No liberes memoria que no vino de malloc (arreglos locales, literales).",
]
reglas = ["0x3002h", "0x300Fh"]

